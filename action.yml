name: Run AWS Emulator
description: "Run the AWS Emulator (local AWS APIs) in Docker and point the AWS CLI and SDKs at it. Unofficial community action."
author: TerraConstructs contributors (derived from xSAVIKx/run-aws-emulator by Yurii Serhiichuk)
branding:
  icon: cloud
  color: orange

inputs:
  image:
    description: >-
      Container image to run. Pin a build tag or a digest for reproducible runs, for example
      ghcr.io/terraconstructs/aws-emulator:1.0.322.1 or ghcr.io/terraconstructs/aws-emulator@sha256:...
    default: ghcr.io/terraconstructs/aws-emulator:latest
  port:
    description: Port on 127.0.0.1, from 1 to 65535. The emulator uses the same port inside the container.
    default: "9297"
  region:
    description: AWS Region for the SDKs (AWS_REGION and AWS_DEFAULT_REGION).
    default: us-east-1
  telemetry:
    description: Upstream emulator telemetry, "on" or "off" ("true", "false", "1" and "0" also work).
    default: "off"
  memory:
    description: Container memory limit.
    default: 2g
  wait-timeout:
    description: Seconds to wait until the emulator is healthy (a whole number, 1 or more).
    default: "60"
  pull:
    description: Pull the image before the start ("true" or "false").
    default: "false"
  engine:
    description: >-
      Container engine, "docker" or "podman". Empty means Docker if it is installed,
      else Podman.
    default: ""
  verify:
    description: >-
      Verify the cosign signature of the image before the start ("true" or "false"). The action
      resolves the image to a digest, verifies it, and runs that exact digest. cosign must be on
      the PATH (add sigstore/cosign-installer before this action).
    default: "true"
  certificate-identity:
    description: Expected signer identity of the image signature (cosign --certificate-identity).
    default: https://github.com/TerraConstructs/aws-emulator-docker/.github/workflows/release.yml@refs/heads/main
  certificate-oidc-issuer:
    description: Expected OIDC issuer of the image signature (cosign --certificate-oidc-issuer).
    default: https://token.actions.githubusercontent.com

outputs:
  endpoint-url:
    description: The emulator endpoint, for example https://127.0.0.1:9297.
    value: ${{ steps.start.outputs.endpoint-url }}
  ca-file:
    description: The emulator CA certificate (PEM).
    value: ${{ steps.start.outputs.ca-file }}
  container:
    description: The container name (aws-emulator-<port>). Use it with "docker logs". The action sets it also when the start fails.
    value: ${{ steps.start.outputs.container }}
  image-digest:
    description: The repository digest of the image that runs. When verify is true, this is the verified digest and the container runs from it. Empty if the image has no digest for its repository.
    value: ${{ steps.start.outputs.image-digest }}

runs:
  using: composite
  steps:
    - id: start
      shell: bash
      env:
        EMULATOR_IMAGE: ${{ inputs.image }}
        EMULATOR_PORT: ${{ inputs.port }}
        EMULATOR_REGION: ${{ inputs.region }}
        EMULATOR_TELEMETRY: ${{ inputs.telemetry }}
        EMULATOR_MEMORY: ${{ inputs.memory }}
        EMULATOR_WAIT: ${{ inputs.wait-timeout }}
        EMULATOR_PULL: ${{ inputs.pull }}
        EMULATOR_ENGINE: ${{ inputs.engine }}
        EMULATOR_VERIFY: ${{ inputs.verify }}
        EMULATOR_CERT_IDENTITY: ${{ inputs.certificate-identity }}
        EMULATOR_CERT_OIDC_ISSUER: ${{ inputs.certificate-oidc-issuer }}
      run: '"$GITHUB_ACTION_PATH/start-emulator.sh" --github-env'
